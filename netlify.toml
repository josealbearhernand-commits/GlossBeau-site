# Netlify build settings for the GlossBeau Next.js site.
# Environment variables (SHOPIFY_STORE_DOMAIN, SHOPIFY_STOREFRONT_ACCESS_TOKEN, REVALIDATE_SECRET) are set in the
# Netlify UI or with `netlify env:set`, never committed. The prebuild step (placeholder check + photo trimming)
# runs inside `npm run build`. The Next.js runtime plugin turns the build into Netlify functions and sets the
# publish directory itself, so no `publish` is given here.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
